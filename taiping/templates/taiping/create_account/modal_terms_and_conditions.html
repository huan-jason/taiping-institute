{% load extra_tags %}

<div class="modal fade" id="modal-terms-and-conditions" tabindex="-1">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">

            <div class="modal-header text-bg-primary">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Agojin Terms & Conditions</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">{{ app_data.terms_and_conditions.data | from_markdown }}</div>

            <div class="modal-footer">

                <button type="button" class="btn btn-danger" data-bs-dismiss="modal"
                    onclick="accept('terms_and_conditions', false)">Disagree</button>

                <button type="button" class="btn btn-success" data-bs-dismiss="modal"
                    onclick="accept('terms_and_conditions', true)">
                    Agree
                </button>
            </div>

        </div>
    </div>
</div>

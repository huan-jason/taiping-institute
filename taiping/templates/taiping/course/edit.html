{% extends "taiping/base.html" %}


{% block content %}

{% include "../create_account/css.html" %}


<form id="form--course-details" method="post" enctype="multipart/form-data" onchange="onChangeForm(this)">
    {% csrf_token %}

    <div class="container" hx-swap="none">


        <div id="page-content">

            <h5 class="fw-bold mb-4">
                {% if course_id %} Edit {% else %} New {% endif %}
                Agojin Course
            </h5>

            <div class="form-group">
                <label class="form-label">Course Group</label>
                <select class="form-select" name="course_group_id">
                    <option value=""></option>

                    {% for item in course_groups %}
                    <option value="{{ item.id }}" {% if item.id == course.course_group.id %} selected {% endif %}>
                        {{ item.name }}</option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Course Name</label>
                <input type="text" class="form-control" name="name" value="{{ course.name }}"
                    placeholder="Enter course name" required>
            </div>

            <div class="form-group">
                <label class="form-label">Course Chinese Name</label>
                <input type="text" class="form-control" name="chinese_name" value="{{ course.chinese_name }}"
                    placeholder="Enter course Chinese name" required>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" placeholder="Enter course description" rows="5"
                    required>{{ course.description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Short Description</label>
                <textarea class="form-control" name="short_description" placeholder="Enter course short description"
                    rows="5" required>{{ course.short_description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Instructor</label>
                <select class="form-select {% if not user.is_superuser %} pe-none {% endif %}" name="instructor_id"
                    required>
                    <option></option>

                    <!-- noformat -->
                    {% for item in instructors %}
                        <option value="{{ item.id }}"
                            {% if not course and item.user_id == user.id %} selected
                            {% elif item.id == course.instructor.id %} selected {% endif %}
                        >
                            {{ item.user.get_full_name }}
                        </option>
                    {% endfor %}
                    <!-- noformat -->

                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Facility</label>
                <select class="form-select" name="facility_id" required>
                    <option></option>

                    {% for item in facilities %}
                    <option value="{{ item.id }}" {% if item.id == course.facility.id %} selected {% endif %}>
                        {{ item.name }}</option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Course Fee</label>
                <input type="number" class="form-control" name="course_fee" value="{{ course.course_fee }}" min="0"
                    placeholder="Enter course fee" required>
            </div>

            <div class="form-group">
                <label class="form-label">Min Students</label>
                <input type="number" class="form-control" name="min_students" value="{{ course.min_students }}" min="1"
                    placeholder="Enter minimum students" required>
            </div>

            <div class="form-group">
                <label class="form-label">Max Students</label>
                <input type="number" class="form-control" name="max_students" value="{{ course.max_students }}" min="1"
                    placeholder="Enter maximum students" required>
            </div>

            <div class="form-group">
                <label class="form-label d-inline-block">Image: </label>
                <div class="d-inline-block ms-3">{{ course.image_name }}</div>
                <input type="file" class="form-control mt-2" name="image" placeholder="Upload course image"
                    accept="image/*">
            </div>

            <button id="button--submit" type="submit" class="btn btn-primary mt-3" disabled
                _="on click remove .d-none from .spinner">
                Submit
                <span id="spinner--submit" class="spinner spinner-border spinner-border-sm ms-2 d-none"></span>
            </button>

        </div>

    </div>


    <script>
        function onChangeForm(form) {
            form = form || document.querySelector('#form--course-details')
            const items = [...form.elements]
            const isValid = items.every(item => item.validity.valid)
            document.querySelector('#button--submit').disabled = !isValid
        }

        function resizeTextarea(textarea) {
            textarea.style.height = `${textarea.scrollHeight + 3}px`
        }

        window.onload = () => {
            onChangeForm();
            const textareas = [...document.querySelectorAll('textarea')]
            textareas.map(resizeTextarea)
            textareas.map(item => item.addEventListener('input', e => resizeTextarea(e.target)))
        }

    </script>

    {% endblock content %}

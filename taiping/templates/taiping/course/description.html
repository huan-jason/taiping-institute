{% load extra_tags %}

<style>
    #course-description {

        .course-description-text p {
            margin-bottom: 1.5em;
        }

    }

    .course-image {
        width: 100%;
        margin-top: 1em;
    }
</style>


<div id="course-description">
    <h3 class="text-center fw-bold">

        {% if course.image %}
        <div><img class="course-image" src="{{ course.image.url }}" alt="{{ course.name }}" /></div>
        {% endif %}

        <div class="mt-4">{{ course.name }}</div>
        <div class="mt-3">{{ course.chinese_name }}</div>
    </h3>

    <div class="course-description-text mt-4">
        {{ course.description | from_markdown }}
    </div>
</div>

<div class="dash-section">
    <div class="section-header">
        <span class="section-title">Revenue Overview</span>
        <a href="#" class="section-action">View Full Report</a>
    </div>

    <div class="rev-chart">

        {% for item in revenues %}

        <div class="rev-bar-wrap">
            <div class="rev-bar-height-wrap">
                <div class="rev-bar" data-height="{{ item.height }}" title="${{ item.amount | floatformat:'0g' }}">
                </div>
            </div>
            <div class="rev-label">{{ item.month | date:'M' }}</div>
        </div>

        {% endfor %}

    </div>

    {% with item=revenues|last %}

    <div class="rev-footer">
        <div>
            <div class="rev-period">{{ item.month | date:'F Y' }}</div>
            <div class="rev-total">${{ item.amount | floatformat:'0g' }}</div>
        </div>
        <div style="text-align:right">
            <div class="rev-period">Year to date</div>
            <div class="rev-total">${{ ytd_amount | default:0 | floatformat:'0g' }}</div>
        </div>
    </div>

    {% endwith %}

</div>

<style>
  /* ── DASHBOARD LAYOUT ── */
  .dash-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 36px 40px 80px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
    align-items: start;
  }

  @media(max-width:900px) {
    .dash-wrap {
      grid-template-columns: 1fr;
    }
  }

  /* Sidebar */
  .sidebar-profile {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  .avatar {
    width: 64px;
    height: 64px;
    background: var(--ink);
    border-radius: 50%;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    color: var(--gold-lt);
    font-weight: 500;
  }

  .profile-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
  }

  .profile-role {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--warm-mid);
    margin-top: 3px;
  }

  .profile-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    margin-top: 18px;
    border-top: 1px solid var(--border);
  }

  .pstat {
    background: var(--card-bg);
    padding: 12px 8px;
    text-align: center;
  }

  .pstat-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
  }

  .pstat-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--warm-mid);
    margin-top: 2px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    background: unset;
    height: max-content;
  }

  .snav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    font-size: 13px;
    color: var(--stone);
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    width: 100%;
  }

  .snav-item:last-child {
    border-bottom: none;
  }

  .snav-item:hover {
    background: var(--parchment);
    color: var(--ink);
  }

  .snav-item.active {
    background: var(--ink);
    color: #fff;
  }

  .snav-item.active svg {
    stroke: #fff;
  }

  .snav-item svg {
    flex-shrink: 0;
    opacity: 0.6;
  }

  .snav-item.active svg {
    opacity: 1;
  }

  /* Main content */
  .dash-section {
    margin-bottom: 28px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
  }

  .section-action {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    cursor: pointer;
    text-decoration: none;
  }

  .section-action:hover {
    color: var(--gold-lt);
  }

  /* Stat cards */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  @media(max-width:900px) {
    .stat-row {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 20px 22px;
  }

  .stat-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .stat-icon {
    width: 36px;
    height: 36px;
    background: var(--parchment);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stat-badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
  }

  .stat-badge.up {
    background: #edf6f0;
    color: var(--green);
  }

  .stat-badge.neutral {
    background: #f5f0e8;
    color: var(--warm-mid);
  }

  .stat-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 400;
    color: var(--ink);
    margin-top: 12px;
    line-height: 1;
  }

  .stat-label {
    font-size: 12px;
    color: var(--warm-mid);
    margin-top: 4px;
    letter-spacing: 0.04em;
  }

  /* Table */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }

  .data-table th {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--warm-mid);
    padding: 12px 16px;
    text-align: left;
    background: var(--parchment);
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }

  .data-table td {
    padding: 13px 16px;
    font-size: 13px;
    color: var(--stone);
    border-bottom: 1px solid var(--border);
  }

  .data-table tr:last-child td {
    border-bottom: none;
  }

  .data-table tr:hover td {
    background: #fdf9f4;
  }

  .td-name {
    font-weight: 700;
    color: var(--ink);
  }

  .td-name span {
    display: block;
    font-size: 12px;
    color: var(--warm-mid);
    font-weight: 400;
    font-style: italic;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 2px;
  }

  .progress--completed,
  .progress--in-progress,
  .badge-green {
    background: #edf6f0;
    color: var(--green);
  }

  .progress--upcoming,
  .badge-gold {
    background: #fdf5e6;
    color: var(--gold);
  }

  .badge-grey {
    background: #f0ede8;
    color: var(--warm-mid);
  }

  .badge-red {
    background: #faeaea;
    color: var(--red);
  }

  /* Calendar */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-header-day {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--warm-mid);
    padding: 8px 0;
  }

  .cal-day {
    background: var(--card-bg);
    border: 1px solid var(--border);
    min-height: 72px;
    padding: 8px;
    position: relative;
    font-size: 12px;
    color: var(--warm-mid);

    &.other-month .cal-date {
      opacity: 0.25;
    }
  }

  .cal-day.today {
    border-color: var(--gold);
    background: #fdf9f0 !important;
  }

  .cal-day.has-event {
    background: #fff;
  }

  .cal-date {
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .cal-day.today .cal-date {
    color: var(--gold);
  }

  .cal-event.event--1,
  .cal-event {
    font-size: 10px;
    background: var(--ink);
    color: #fff;
    padding: 2px 6px;
    border-radius: 1px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-event.event--2,
  .cal-event.gold {
    background: var(--gold);
    color: var(--ink);
  }

  .cal-event.event--3,
  .cal-event.green {
    background: var(--green);
    color: #fff;
  }

  .cal-empty {
    background: transparent;
    border: 1px solid transparent;
    min-height: 72px;
  }

  .cal-month {
    text-align: center;
  }

  /* Revenue chart bar */
  .rev-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 120px;
    padding: 12px 16px 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-bottom: none;
  }

  .rev-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
  }

  .rev-bar-height-wrap {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: end;
  }

  .rev-bar {
    width: 100%;
    background: var(--border);
    border-radius: 1px;
    transition: background 0.2s;
    cursor: default;
    height: attr(data-height %);
  }

  .rev-bar:hover {
    background: var(--gold-lt);
  }

  .rev-chart .rev-bar-wrap:last-child .rev-bar,
  .rev-bar.current {
    background: var(--gold);
  }

  .rev-label {
    font-size: 10px;
    color: var(--warm-mid);
    letter-spacing: 0.06em;
  }

  .rev-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }

  .rev-total {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    color: var(--ink);
  }

  .rev-period {
    font-size: 12px;
    color: var(--warm-mid);
  }

  /* Student enrolled course cards */
  .enrolled-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .enrolled-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    display: flex;
    gap: 0;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .enrolled-card:hover {
    box-shadow: 0 6px 24px rgba(26, 23, 20, 0.08);
  }

  .enrolled-img {
    width: 120px;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
  }

  .enrolled-body {
    padding: 16px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .enrolled-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
  }

  .enrolled-zh {
    font-size: 12px;
    color: var(--gold);
    font-style: italic;
    margin-top: 2px;
  }

  .enrolled-meta {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--warm-mid);
  }

  .enrolled-meta span {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .progress-wrap {
    margin-top: 10px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--warm-mid);
    margin-bottom: 5px;
  }

  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }

  .progress-fill {
    height: 3px;
    background: var(--gold);
    border-radius: 2px;
  }

  /* Upcoming mini list */
  .upcoming-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .upcoming-item {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }

  .upcoming-item:last-child {
    border-bottom: none;
  }

  .upcoming-date-box {
    width: 46px;
    text-align: center;
    flex-shrink: 0;
    background: var(--ink);
    padding: 6px 4px;
  }

  .upcoming-month {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .upcoming-day {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: #fff;
    line-height: 1;
  }

  .upcoming-info {
    flex: 1;
  }

  .upcoming-course {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }

  .upcoming-detail {
    font-size: 12px;
    color: var(--warm-mid);
    margin-top: 2px;
  }

  .upcoming-time {
    font-size: 12px;
    color: var(--stone);
    font-weight: 700;
    white-space: nowrap;
  }

  /* Manage courses */
  .link--course__edit,
  .link--course__view {
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }

  .link--course__edit {
    color: var(--gold);
    margin-right: 12px;
  }

  .link--course__view {
    color: var(--warm-mid);
  }


  @media (max-width: 650px) {
    .profile-stats {
      grid-template-columns: 1fr;
    }
  }
</style>

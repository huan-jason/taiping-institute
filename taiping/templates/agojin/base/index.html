<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Agojin</title>
  <meta name="description" content="Agojin is an online platform dedicated to holistic
        learning, offering courses in martial arts, health cultivation and creative arts.
        The platform connects students with experienced instructors, providing structured
        programs that promote physical strength, mental clarity, personal development,
        and cultural knowledge. Agojin supports lifelong learning through accessible,
        high-quality courses designed to enhance wellbeing, self-mastery, and creative
        expression.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">


  {% if use_bootstrap %}
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  {% endif %}

  <!-- OpenProps -->
  <link rel="stylesheet" href="https://unpkg.com/open-props" />

  <!-- HTMX -->
  <script defer src="https://unpkg.com/htmx.org@1.9.10"></script>

  <!-- Hyperscript -->
  <script defer src="https://unpkg.com/hyperscript.org@0.9.12"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"
    defer></script>

  {% include "./style.html" %}

  {% block style %}
  {% endblock style %}

</head>

<body>

  {% block header %}
  {% include "./header.html" %}
  {% endblock header %}

  {% block content %}
  {% endblock content %}

  {% block script %}
  {% endblock script %}

</body>

</html>

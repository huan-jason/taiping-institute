<style>
  :root {
    --ink: #1a1714;
    --stone: #3d3830;
    --warm-mid: #7a6f62;
    --parchment: #f5f0e8;
    --cream: #faf7f2;
    --gold: #b8922a;
    --gold-lt: #d4aa50;
    --red: #8b2a2a;
    --green: #2a6645;
    --border: #e2d9cc;
    --card-bg: #ffffff;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── NAV ── */
  nav {
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 62px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-mark {
    width: 34px;
    height: 34px;
    background: var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }

  .nav-brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 20px;
    color: #fff;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 0;
    list-style: none;
  }

  .nav-links li a {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    text-decoration: none;
    transition: color 0.2s;
    padding: 0 18px;
    height: 62px;
    display: flex;
    align-items: center;
    border-bottom: 2px solid transparent;
  }

  .nav-links li a:hover {
    color: var(--gold-lt);
  }

  .nav-links li a.active {
    color: #fff;
    border-bottom-color: var(--gold);
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn-nav {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 18px;
    border: 1px solid var(--gold);
    color: var(--gold-lt);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-nav:hover {
    background: var(--gold);
    color: var(--ink);
  }

  .nav-user {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.05em;
    text-decoration: none;
  }

  /* ── PAGE HEADER ── */
  .page-header {
    background: var(--ink);
    padding: 48px 40px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .page-header::before {
    content: attr(data-char);
    font-family: 'Cormorant Garamond', serif;
    font-size: 185px;
    color: rgba(255, 255, 255, 0.03);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -52%);
    pointer-events: none;
    line-height: 1;
  }

  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .header-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1.15;
  }

  .header-title em {
    font-style: italic;
    color: var(--gold-lt);
  }

  .header-sub {
    margin-top: 8px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.08em;
  }

  /* misc */
  .ico {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
  }

  .loader {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 1.5em;
    height: 1.5em;
    animation: spin 1s linear infinite;
  }

  .mx-auto {
    margin-inline: auto;
  }

  .mt-3 {
    margin-top: 1em;
  }

  .visibility-hidden {
    visibility: hidden;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }


  @media (max-width: 800px) {
    .nav-brand {
      display: none;
    }
  }

  @media (max-width: 450px) {
    nav {
      padding-inline: 0.5em;
    }

    .nav-logo {
      display: none;
    }
  }
</style>

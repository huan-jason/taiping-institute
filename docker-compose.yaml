services:

  app:
    image: agojin
    build: ./docker
    pull_policy: build
    restart: always
    volumes:
      - ./:/app
      - ./.nginx-unit:/docker-entrypoint.d
    links:
      - db
    depends_on:
      - db


  db:
    image: postgres:18
    restart: always
    volumes:
      - ./.db:/var/lib/postgresql
      - ./:/app
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    shm_size: '4gb'
    secrets:
      - postgres_password


secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

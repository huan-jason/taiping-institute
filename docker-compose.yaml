services:

  app:
    image: agojin
    build: ./docker/app
    pull_policy: build
    restart: always
    volumes:
      - ./:/app
      - ./.nginx-unit:/docker-entrypoint.d
    links:
      - db
    depends_on:
      - db
    entrypoint: ["daphne"]
    command: ["--bind", "0.0.0.0", "project.asgi:application"]
    secrets:
      - django_secret_key
      - email_host_password


  db:
    image: postgres:18
    restart: always
    volumes:
      - ./.db:/var/lib/postgresql
      - ./:/app
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    shm_size: '4gb'
    secrets:
      - postgres_password


secrets:
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  email_host_password:
    file: ./secrets/email_host_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
